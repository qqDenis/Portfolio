<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вхід — Моє портфоліо</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="form.css">
</head>
<body>

<header class="header">
    <div class="logo">Portfolio</div>
    <nav class="main-nav">
        <ul class="nav-list">
            <li><a href="index.html#achievements">Досягнення</a></li>
            <li><a href="index.html#goals">Цілі</a></li>
            <li><a href="index.html#contacts">Контакти</a></li>
        </ul>
    </nav>
    <div class="user-actions">
        <a href="index.html#contacts" class="btn btn-cart">Зв'язок</a>
    </div>
</header>

<main class="form-page">
    <h2>Вхід до акаунту</h2>

    <form action="https://formspree.io/f/xvzybdqa" method="POST" class="auth-form">

        <!-- Блок 1: Особисті дані -->
        <fieldset>
            <legend>1. Особисті дані</legend>

            <div class="form-group">
                <label for="fullName">ПІБ:</label>
                <input
                    type="text"
                    id="fullName"
                    name="fullName"
                    required
                    minlength="5"
                    placeholder="Іванов Іван Іванович"
                    title="Введіть повне ім'я (мінімум 5 символів)"
                />
            </div>

            <div class="form-group">
                <label for="email">Email:</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    required
                    placeholder="example@gmail.com"
                />
            </div>

            <div class="form-group">
                <label for="phone">Телефон:</label>
                <!-- Валідація на 10-12 цифр + код країни -->
                <input
                    type="tel"
                    id="phone"
                    name="phone"
                    pattern="[\+]\d{2}\d{10}"
                    placeholder="+380991234567"
                    required
                    title="Формат: +380XXXXXXXXXX"
                />
            </div>

            <div class="form-group">
                <label for="birthdate">Дата народження:</label>
                <input
                    type="date"
                    id="birthdate"
                    name="birthdate"
                    required
                />
            </div>
        </fieldset>

        <!-- Блок 2: Тип акаунту -->
        <fieldset>
            <legend>2. Тип акаунту</legend>

            <div class="form-radio">
                <input type="radio" id="roleVisitor" name="role" value="visitor" checked />
                <label for="roleVisitor">Відвідувач</label>
            </div>
            <div class="form-radio">
                <input type="radio" id="rolePartner" name="role" value="partner" />
                <label for="rolePartner">Партнер</label>
            </div>
            <div class="form-radio">
                <input type="radio" id="roleRecruiter" name="role" value="recruiter" />
                <label for="roleRecruiter">Рекрутер</label>
            </div>

            <div class="form-group" style="margin-top: 1rem;">
                <label for="city">Місто:</label>
                <select id="city" name="city">
                    <option value="kyiv">Київ</option>
                    <option value="lviv">Львів</option>
                    <option value="odesa">Одеса</option>
                    <option value="kharkiv">Харків</option>
                    <option value="dnipro">Дніпро</option>
                    <option value="kirovohrad">Кіровоград</option>
                    <option value="Dolynsʹka">Долинська</option>
                    <option value="Ivano-Frankivsʹk">Івано-Франківськ</option>
                    <option value="Zaporizhzhya">Запоріжжя</option>
                </select>
            </div>
        </fieldset>

        <!-- Блок 3: Коментар та згода -->
        <fieldset>
            <legend>3. Коментар та згода</legend>

            <div class="form-group">
                <label for="comment">Коментар (необов'язково):</label>
                <textarea
                    id="comment"
                    name="comment"
                    rows="4"
                    placeholder="Напишіть, з якою метою ви заходите на цей сайт..."
                ></textarea>
            </div>

            <div class="form-checkbox">
                <input type="checkbox" id="agree" name="agree" required />
                <label for="agree">Я погоджуюсь з <a href="#">правилами сайту</a></label>
            </div>
        </fieldset>

        <button type="submit" class="btn btn-primary">Увійти</button>
    </form>

    <p class="form-alt-link">Ще немає акаунту? <a href="register.html">Зареєструватись</a></p>
</main>

<footer id="contacts">
    <p>Контактна інформація: dpetrenko055@gmail.com</p>
    <form action="https://formspree.io/f/maqkewdp" method="POST">
        <label for="user-email">Залиште свій Email для співпраці:</label>
        <input type="email" name="email" id="user-email" placeholder="sixseven@gmail.com" required>
        <button type="submit" class="btn">Підписатися</button>
    </form>
</footer>

<p class="copyright">&copy; 2026 My Portfolio</p>

</body>
</html>
